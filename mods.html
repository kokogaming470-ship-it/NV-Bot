<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مودات NV — Forge 1.20.1</title>
<style>
:root{--ink:#151a27;--slate:#1f2638;--slate2:#2a3350;--line:#37426399;--lapis:#4b7bec;--gold:#f0b840;--text:#e8ecf6;--muted:#8e98b4;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--ink:#eef1f8;--slate:#fff;--slate2:#e4e9f5;--line:#c5cde2;--text:#1a2138;--muted:#5d688a;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.6 "Segoe UI",Tahoma,system-ui,sans-serif}
.wrap{max-width:820px;margin:auto;padding:28px 18px 60px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.big{display:flex;gap:14px;align-items:center;background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:22px;flex-wrap:wrap}
.big .t{flex:1;min-width:200px}
.big b{font-size:17px}
a.btn{display:inline-block;background:var(--lapis);color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-weight:600}
a.btn:focus-visible,input:focus-visible,a.dl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
ol{margin:0 0 22px;padding-inline-start:20px;color:var(--muted)}
ol b{color:var(--text)}
input{width:100%;background:var(--slate2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;margin-bottom:10px}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--slate)}
li+li{border-top:1px solid var(--line)}
li .n{flex:1;min-width:0;overflow-wrap:anywhere;direction:ltr;text-align:left}
li .s{color:var(--muted);font-size:13px;white-space:nowrap}
a.dl{color:var(--lapis);text-decoration:none;font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>مودات السيرفر</h1>
  <p class="sub">Minecraft 1.20.1 • Forge • <span id="count">…</span></p>

  <div class="big">
    <div class="t"><b>حمّل كل المودات مرة واحدة</b><br><span style="color:var(--muted)">ملف zip واحد (<span id="total">…</span>)</span></div>
    <a class="btn" href="/mods/all.zip">تحميل الكل</a>
  </div>

  <ol>
    <li>ثبّت <b>Forge 1.20.1</b> (أي إصدار 47.x).</li>
    <li>فك الضغط وحط ملفات <b>.jar</b> جوا فولدر <b>mods</b> في مجلد <b>.minecraft</b> (اكتب <b>%appdata%\.minecraft</b> في Run).</li>
    <li>شغّل ماين كرافت بملف Forge وادخل السيرفر.</li>
  </ol>

  <input id="q" placeholder="دوّر على مود..." aria-label="بحث">
  <ul id="list"></ul>
</div>
<script>
const fmt=b=>b>1e9?(b/1e9).toFixed(2)+' GB':b>1e6?(b/1e6).toFixed(1)+' MB':Math.ceil(b/1e3)+' KB'
let mods=[]
function draw(){
  const q=document.getElementById('q').value.toLowerCase()
  const f=mods.filter(m=>m.name.toLowerCase().includes(q))
  document.getElementById('list').innerHTML=f.map(m=>`<li><span class="n">${m.name.replace(/[<>&]/g,'')}</span><span class="s">${fmt(m.size)}</span><a class="dl" href="/mods/file/${encodeURIComponent(m.name)}">تحميل</a></li>`).join('')||'<li class="empty">مفيش مودات هنا.</li>'
}
fetch('/api/mods').then(r=>r.json()).then(d=>{
  mods=d
  document.getElementById('count').textContent=d.length+' مود'
  document.getElementById('total').textContent=fmt(d.reduce((a,m)=>a+m.size,0))
  draw()
})
document.getElementById('q').addEventListener('input',draw)
</script>
</body>
</html>
